<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Calories" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Calorie Tracker</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('calorie-tracker-settings')
          var theme = raw ? JSON.parse(raw).theme : 'system'
          var dark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var resolved = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = resolved
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = resolved
          var meta = document.querySelector('meta[name="color-scheme"]')
          if (meta) meta.setAttribute('content', dark ? 'only dark' : 'only light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
